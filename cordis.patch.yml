# dsh-mindmap bundle patch: inserts the plugin row into the profile roster.
# The node half (exports ".") registers the /dsh-mindmap/api routes on the
# shared DSH webserver; the dsh.client declaration loads exports "./client"
# in the web GUI, which registers the 思维导图 sidebar row and main page.
- insert:
    - id: dsh-mindmap
      name: '@huoweifang/dsh-mindmap'
