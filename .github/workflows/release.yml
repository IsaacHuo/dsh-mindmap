name: Release

# Runs only when a maintainer pushes a version tag (v0.1.0, v0.2.0-rc.1, ...).
# Publishes via npm Trusted Publishing (OIDC, no token): the package trusts
# IsaacHuo/dsh-mindmap + .github/workflows/release.yml. Needs npm >= 11.5.1 and
# id-token: write. Skips publishing when the version is already on npm.
on:
  push:
    tags: ['v*']
  # Manual run: only tests the npm OIDC token exchange, never publishes.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  oidc-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Exchange GitHub OIDC token with npm (no publish, token not printed)
        run: |
          id="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)"
          echo "claims:"; echo "$id" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{repository, repository_owner, workflow_ref, job_workflow_ref, ref, environment}' || true
          code="$(curl -sS -o resp.json -w '%{http_code}' -X POST -H "Authorization: Bearer $id" https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@huoweifang%2fdsh-mindmap)"
          echo "exchange HTTP $code"
          jq 'del(.token)' resp.json 2>/dev/null || head -c 400 resp.json

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm with OIDC trusted publishing support
        run: npm install -g npm@11.17.0
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: npm run check
      - run: git diff --exit-code -- lib
      - run: npm run pack:check
      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"; v="$(node -p "require('./package.json').version")"
          if npm view "$name@$v" version >/dev/null 2>&1; then echo "$name@$v already on npm, skipping publish"; exit 0; fi
          if echo "${GITHUB_REF_NAME}" | grep -q -- '-'; then tag=next; else tag=latest; fi
          npm publish --provenance --access public --tag "$tag"
      - name: GitHub Release
        run: |
          npm pack
          flags=""; if echo "${GITHUB_REF_NAME}" | grep -q -- '-'; then flags="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" huoweifang-dsh-mindmap-*.tgz --title "${GITHUB_REF_NAME}" --generate-notes $flags
        env:
          GH_TOKEN: ${{ github.token }}
